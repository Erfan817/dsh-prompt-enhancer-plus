<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Spark：从粗略草稿到结构化提示词</title>
  <desc id="desc">工作流程示意图：输入导出 CSV 功能的草稿，生成包含任务、要求、验收标准和约束的提示词，再由用户审阅、编辑、复制或替换。此图不是产品界面截图。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10172b"/>
      <stop offset="1" stop-color="#182440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d6bfe"/>
      <stop offset="1" stop-color="#7c9aff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#050913" flood-opacity="0.28"/>
    </filter>
    <style>
      .sans { font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, "Microsoft YaHei", monospace; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#background)"/>
  <circle cx="1100" cy="44" r="180" fill="#4d6bfe" opacity="0.08"/>
  <circle cx="70" cy="590" r="160" fill="#77e0c1" opacity="0.05"/>

  <g class="sans">
    <rect x="64" y="42" width="38" height="38" rx="11" fill="#4d6bfe"/>
    <path d="M82 49l2.7 7.5 7.5 2.7-7.5 2.7-2.7 7.5-2.7-7.5-7.5-2.7 7.5-2.7L82 49Z" fill="#fff"/>
    <text x="116" y="69" fill="#f5f7ff" font-size="24" font-weight="700">Prompt Spark</text>
    <text x="1136" y="67" fill="#9eabd0" font-size="14" text-anchor="end" letter-spacing="1.6">WORKFLOW · 工作流程</text>

    <text x="64" y="126" fill="#ffffff" font-size="32" font-weight="700">把模糊想法，变成可审阅的结构化提示词</text>
    <text x="64" y="157" fill="#aeb9d8" font-size="17">Turn a rough idea into clear instructions — while you stay in control.</text>
  </g>

  <g filter="url(#shadow)" class="sans">
    <rect x="64" y="190" width="410" height="300" rx="20" fill="#1c2742" stroke="#344362"/>
    <rect x="560" y="190" width="576" height="300" rx="20" fill="#1c2742" stroke="#40557f"/>
  </g>

  <g class="sans">
    <text x="92" y="228" fill="#8fa8ff" font-size="14" font-weight="700" letter-spacing="1.4">01 · 你的草稿 / YOUR DRAFT</text>
    <rect x="92" y="254" width="354" height="142" rx="14" fill="#131c31"/>
    <text x="116" y="292" fill="#eef2ff" font-size="19">
      <tspan x="116" dy="0">帮我做一个导出 CSV 的功能，</tspan>
      <tspan x="116" dy="34">要能选字段、使用 UTF-8，</tspan>
      <tspan x="116" dy="34">不要修改现有数据结构。</tspan>
    </text>
    <text x="92" y="442" fill="#8e9bb9" font-size="15">目标有了，但任务边界还不够清楚。</text>
    <text x="92" y="467" fill="#8e9bb9" font-size="14">A goal, without enough structure yet.</text>
  </g>

  <g class="sans">
    <path d="M495 338h40" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M527 328l12 10-12 10" fill="none" stroke="#7c9aff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="488" y="287" width="56" height="28" rx="14" fill="#4d6bfe" opacity="0.18"/>
    <text x="516" y="306" fill="#b9c8ff" font-size="12" text-anchor="middle" font-weight="700">强化</text>
  </g>

  <g class="mono">
    <text x="588" y="228" fill="#77e0c1" font-size="14" font-weight="700" letter-spacing="1">02 · 结构化结果 / STRUCTURED PROMPT</text>
    <text x="588" y="270" fill="#8fa8ff" font-size="17" font-weight="700">Task:</text>
    <text x="660" y="270" fill="#eef2ff" font-size="17">做一个导出 CSV 的功能。</text>
    <text x="588" y="308" fill="#8fa8ff" font-size="17" font-weight="700">Requirements:</text>
    <text x="588" y="338" fill="#eef2ff" font-size="16">1. 可选择导出字段；2. 支持 UTF-8。</text>
    <text x="588" y="376" fill="#8fa8ff" font-size="17" font-weight="700">Acceptance criteria:</text>
    <text x="588" y="406" fill="#eef2ff" font-size="16">导出字段与选择一致，文件可正常打开。</text>
    <text x="588" y="444" fill="#8fa8ff" font-size="17" font-weight="700">Constraints:</text>
    <text x="722" y="444" fill="#eef2ff" font-size="16">不修改现有数据结构。</text>
    <text x="588" y="474" fill="#8e9bb9" font-size="12">示例仅说明输出形式，实际结果由草稿与模型决定。</text>
  </g>

  <g class="sans">
    <rect x="64" y="522" width="330" height="48" rx="24" fill="#223252"/>
    <rect x="435" y="522" width="330" height="48" rx="24" fill="#223252"/>
    <rect x="806" y="522" width="330" height="48" rx="24" fill="#223252"/>
    <text x="229" y="552" fill="#dbe4ff" font-size="16" text-anchor="middle" font-weight="600">选择详细度 · Choose a level</text>
    <text x="600" y="552" fill="#dbe4ff" font-size="16" text-anchor="middle" font-weight="600">预览并编辑 · Review &amp; edit</text>
    <text x="971" y="552" fill="#dbe4ff" font-size="16" text-anchor="middle" font-weight="600">复制或替换 · Copy or replace</text>
    <text x="1136" y="602" fill="#74819e" font-size="12" text-anchor="end">流程示意，非界面截图 · Illustration, not a product screenshot</text>
  </g>
</svg>
