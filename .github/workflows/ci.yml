name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run regression tests (mock models only)
        run: npm test
      - name: Check bundled native rules and brand icon
        run: node claude-code/build-native.mjs --check
      - name: Smoke-test local service without opening a browser
        run: npm run desktop:smoke
      - name: Verify npm package contents
        run: npm run ci:package

  native-plugin:
    name: Native plugin (Windows, Claude Code 2.1.319)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      DISABLE_TELEMETRY: '1'
      DISABLE_ERROR_REPORTING: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Claude Code test engine
        # The pinned engine's postinstall links its platform binary into bin/claude.exe.
        # Project dependencies above still have lifecycle scripts disabled.
        run: npm install --global @anthropic-ai/claude-code@2.1.319 --no-audit --no-fund
      - name: Show test engine version
        run: claude --version
      - name: Validate native plugin interfaces
        run: npm run claude:validate
      - name: Test native plugin with mock model responses
        run: npm run claude:test
