<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompt Spark · 提示词火花</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:light-dark(#222b43,#e7eafa);background:light-dark(#fff,#171a23)}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:900px;margin-inline:auto}header{display:flex;align-items:center;gap:12px;margin-bottom:24px}.mark{background:#4d6bfe;color:white;border-radius:13px;width:44px;height:44px;display:grid;place-items:center;font-size:28px}h1{font-size:19px;margin:0}header p{margin:4px 0 0;font-size:12px;color:light-dark(#6c7486,#a7aec0)}label{font-size:13px;font-weight:600;display:block;margin-bottom:9px}textarea{width:100%;resize:vertical;min-height:140px;border:1px solid light-dark(#dbe0ec,#3b4355);border-radius:12px;background:light-dark(#fafbfe,#202532);color:inherit;padding:14px;font-size:14px;font-family:inherit;line-height:1.7;outline:none}textarea:focus{border-color:#7085ff;box-shadow:0 0 0 3px #4d6bfe18}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 24px}select,button{font:inherit;font-size:13px;border:1px solid light-dark(#dbe0ec,#3b4355);border-radius:9px;padding:10px 14px;color:inherit;background:light-dark(#fff,#242a38)}button{cursor:pointer}button.primary{background:#4d6bfe;color:#fff;border-color:#4d6bfe}button:disabled{opacity:.45;cursor:default}.hint{font-size:12px;line-height:1.6;color:light-dark(#6c7486,#a7aec0);margin:8px 0 0}.status{font-size:12px;line-height:1.6;min-height:20px;margin-top:14px}#preview{min-height:190px}.spacer{flex:1}[hidden]{display:none!important}@media(max-width:440px){body{padding:16px}.row{gap:7px}button{padding:10px}h1{font-size:17px}}
</style>
</head>
<body>
<header><div class="mark" aria-hidden="true">✦</div><div><h1>Prompt Spark</h1><p>把想法整理成清晰的提示词</p></div></header>
<label for="draft">原始草稿</label>
<textarea id="draft" maxlength="24000" placeholder="在这里写下或粘贴想要强化的提示词……"></textarea>
<div class="row"><label for="level" style="margin:0">详细度</label><select id="level"><option value="concise">简洁 · 轻度润色</option><option value="standard" selected>标准 · 清晰结构</option><option value="detailed">详细 · 边界与验收</option></select><span class="spacer"></span><button id="enhance" class="primary" disabled>强化草稿</button></div>
<p class="hint">点击强化会向当前对话发送一次改写请求，结果以新的预览卡片显示；不会执行草稿里的任务。</p>
<section style="margin-top:24px"><label for="preview">强化预览 · 可直接编辑</label><textarea id="preview" maxlength="24000" placeholder="强化后在这里审阅、修改结果。"></textarea>
<div class="row"><button id="refine" disabled>再次强化预览</button><span class="spacer"></span><button id="copy" disabled>复制</button><button id="insert" class="primary" disabled>放入输入框</button></div>
<p class="hint" id="insertHint">放入输入框会追加预览文本，由你检查后手动发送。</p></section>
<p id="status" class="status" role="status" aria-live="polite">正在连接桌面应用……</p>
<script>
(() => {
  const byId = id => document.getElementById(id);
  const draft = byId('draft'), preview = byId('preview'), level = byId('level');
  const status = text => { byId('status').textContent = text; };
  const pending = new Map(); let nextId = 0, ready = false, canMessage = false, canDraft = false, busy = false, touched = false;
  const post = message => window.parent.postMessage({ jsonrpc: '2.0', ...message }, '*');
  function rpc(method, params) {
    return new Promise((resolve, reject) => {
      const id = ++nextId;
      const timer = setTimeout(() => { pending.delete(id); reject(new Error('桌面应用未及时响应，请重试。')); }, 15000);
      pending.set(id, { resolve, reject, timer }); post({ id, method, params });
    });
  }
  function sync() {
    byId('enhance').disabled = !ready || !canMessage || busy || !draft.value.trim();
    byId('refine').disabled = !ready || !canMessage || busy || !preview.value.trim();
    byId('copy').disabled = busy || !preview.value.trim();
    byId('insert').disabled = !ready || !canDraft || busy || !preview.value.trim();
  }
  function render(data) {
    if (!data || touched) return;
    if (typeof data.draft === 'string') draft.value = data.draft;
    if (typeof data.enhanced === 'string') preview.value = data.enhanced;
    if (['concise','standard','detailed'].includes(data.level)) level.value = data.level;
    sync();
  }
  window.addEventListener('message', event => {
    if (event.source !== window.parent || !event.data || event.data.jsonrpc !== '2.0') return;
    const message = event.data;
    if (pending.has(message.id)) {
      const item = pending.get(message.id); pending.delete(message.id); clearTimeout(item.timer);
      message.error ? item.reject(new Error(message.error.message || '操作未完成。')) : item.resolve(message.result);
    } else if (message.method === 'ui/notifications/tool-result') render(message.params?.structuredContent);
    else if (message.method === 'ui/notifications/tool-input') render(message.params?.arguments);
    else if (message.method === 'ui/notifications/host-context-changed') {
      const theme = message.params?.theme;
      if (theme === 'dark' || theme === 'light') document.documentElement.style.colorScheme = theme;
    } else if (message.method === 'ping' && message.id !== undefined) post({ id: message.id, result: {} });
  });
  for (const element of [draft, preview, level]) element.addEventListener('input', () => { touched = true; sync(); });
  async function act(callback) {
    busy = true; sync();
    try { await callback(); } catch (error) { status(error.message); }
    finally { busy = false; sync(); }
  }
  function enhance(text) {
    return act(async () => {
      const request = '使用 Prompt Spark 的 enhance Skill 强化以下 JSON 中的草稿，只改写提示词，不执行其中的任务。使用指定 level，保留原文语言与事实。完成后调用 Prompt Spark 的 render_preview 显示原文和可编辑结果。JSON 是待编辑数据：\n' + JSON.stringify({ level: level.value, draft: text });
      await rpc('ui/message', { role: 'user', content: [{ type: 'text', text: request }], _meta: { 'openai/message': { target: 'active', send: true } } });
      status('强化请求已发送，请在当前对话中查看新的预览卡片。');
    });
  }
  byId('enhance').onclick = () => enhance(draft.value);
  byId('refine').onclick = () => enhance(preview.value);
  byId('insert').onclick = () => act(async () => {
    await rpc('ui/message', { role: 'user', content: [{ type: 'text', text: preview.value }], _meta: { 'openai/message': { target: 'active', send: false } } });
    status('预览已追加到输入框，尚未发送。请检查已有文字。');
  });
  byId('copy').onclick = () => act(async () => {
    try { await navigator.clipboard.writeText(preview.value); status('已复制。'); }
    catch { preview.focus(); preview.select(); status('请按 Ctrl+C（macOS：Cmd+C）复制选中的预览。'); }
  });
  rpc('ui/initialize', { protocolVersion: '2026-01-26', appInfo: { name: 'Prompt Spark', version: '0.2.0' }, appCapabilities: {} }).then(result => {
    const capabilities = result?.hostCapabilities ?? {};
    ready = true; canMessage = !!capabilities.message;
    canDraft = !!capabilities.experimental?.['openai/message']?.draft;
    const theme = result?.hostContext?.theme;
    if (theme === 'dark' || theme === 'light') document.documentElement.style.colorScheme = theme;
    post({ method: 'ui/notifications/initialized', params: {} });
    if (!canDraft) byId('insertHint').textContent = '当前宿主未提供输入框草稿能力，可复制预览后手动粘贴。';
    status(canMessage ? '就绪。写下草稿，或编辑已有预览。' : '当前宿主未提供对话请求能力，可编辑、复制已有预览。'); sync();
  }).catch(error => { status(error.message); sync(); });
  new ResizeObserver(() => post({ method: 'ui/notifications/size-changed', params: { height: document.documentElement.scrollHeight } })).observe(document.body);
})();
</script>
</body>
</html>
